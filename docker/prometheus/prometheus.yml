global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI serving endpoint. NOTE the trailing slash on metrics_path —
  # the app mounts make_asgi_app at /metrics, which 307-redirects to /metrics/.
  # Prometheus doesn't follow redirects, so we scrape /metrics/ directly.
  - job_name: fraud-serving
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:8000"]
