name: fraud-ml

services:
  # ── Redpanda — Kafka-compatible streaming broker ──────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: fraud-redpanda
    command:
      - redpanda
      - start
      - --mode dev-container        # presets tuned for a single-node laptop
      - --smp 1                     # use just 1 CPU core
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"                 # Kafka API — reachable from your laptop
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # ── Redpanda Console — web UI for topics & messages ───────
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: fraud-redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092

  # ── MinIO — S3-compatible object storage ──────────────────
  minio:
    image: minio/minio:latest
    container_name: fraud-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"                 # S3 API
      - "9001:9001"                 # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  # ── createbuckets — one-shot job: create the 'mlflow' bucket
  createbuckets:
    image: minio/mc:latest
    container_name: fraud-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow
      "

  # ── Redis — online feature store / cache ──────────────────
  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  # ── MLflow — experiment tracking + model registry ─────────
  mlflow:
    build:
      context: ./mlflow
    container_name: fraud-mlflow
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "5050:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow/
    volumes:
      - mlflow-data:/mlflow

  # ── Prometheus — metrics scraping ─────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # ── Grafana — dashboards ──────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  redpanda-data:
  minio-data:
  redis-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
