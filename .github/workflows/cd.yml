name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/serving/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fraud-serving:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fraud-serving:latest
