[project]
name = "fraud-ml"
version = "0.1.0"
description = "Real-time transaction fraud detection ML system"
requires-python = ">=3.11,<3.12"

# Dependencies are managed by conda — see environment.yml

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = [
    "N812", # `from pyspark.sql import functions as F` is the standard idiom
    "N803", # `X` for a feature matrix is the universal ML / scikit-learn convention
    "N806", # ditto for `X_train` / `X_test` locals
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Great Expectations ships incomplete type info. Treat it as untyped so strict
# mode doesn't choke on its un-exported Expectation classes and untyped methods.
module = "great_expectations.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# confluent-kafka ships a py.typed marker but doesn't re-export NewTopic etc.
# via __all__; treat it as untyped (same approach as great_expectations).
module = "confluent_kafka.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pyright]
# Great Expectations ships incomplete type info. Don't flag its untyped surface —
# this mirrors mypy's `ignore_missing_imports = true` for the same library.
reportPrivateImportUsage = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
