exclude: ^notebooks/

repos:
  # ── Code quality: run from the project env (language: system) so the hooks use
  #    the SAME tool versions as `make lint` / CI. Pinned isolated hooks drifted
  #    badly (ruff 0.6.9 vs env 0.15 still enforcing the removed ANN101; mypy with
  #    no libraries) and flagged errors that didn't reproduce locally.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (project env)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black (project env)
        entry: black
        language: system
        types: [python]
      - id: mypy
        name: mypy (project env)
        entry: mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        args: ["src/"]

  # ── General safety hooks (no project deps needed) ────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-merge-conflict
